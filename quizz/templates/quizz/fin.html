{% extends 'quizz/base.html' %}

{% block title %}Fin du Quizz{% endblock %}

{% block content %}
<div class="text-center mt-12">
    <h2 class="text-2xl text-[#2E5C4D] font-bold mb-4"> {{ message }}</h2>
    <p class="text-gray-700 mb-3">
        Tu as terminé le quizz sur <strong>{{ categorie.nom }}</strong>.
    </p>
    
    <p class="text-lg font-semibold text-[#2E5C4D] mb-4">
        ✨ Ta note : {{ score }} / {{ total }}
    </p>


    <a href="{% url 'categories' %}" class="bg-[#2E5C4D] text-white py-2 px-6 rounded hover:bg-[#244c3f] transition">
        Revenir aux catégories
    </a>
</div>
{% endblock %}
