{% extends 'quizz/base.html' %}

{% block title %}Catégories - Quizz Islamique{% endblock %}

{% block content %}
<div class="text-center mt-6 sm:mt-10">
    <h2 class="text-2xl font-semibold text-[#2E5C4D] mb-2">Choisis une catégorie</h2>
    <p class="text-gray-600 mb-6">Explore les différents thèmes et teste tes connaissances !</p>
</div>

<!-- Liste des catégories -->
<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 max-w-4xl mx-auto">
    {% for categorie in categories %}
    <a href="{% url 'quizz' categorie.slug %}"
   class="bg-white p-5 rounded-xl shadow hover:shadow-md hover:-translate-y-1 transition text-center border border-gray-100">
    <!-- Icône illustrative -->
    <div class="text-4xl mb-3">📘</div>
    <h3 class="text-lg font-semibold text-[#2E5C4D]">{{ categorie.nom }}</h3>
</a>

    {% endfor %}
</div>
{% endblock %}
